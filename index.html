<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Redes Sociales</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --primary: #1e293b;
      --accent: #2563eb;
      --bar-yesterday: #94a3b8;
      --bar-today: #2563eb;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      color: var(--primary);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Tarjeta estilo Bosquejo */
    .card {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Encabezado: Foto y Nombre */
    .account-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      background: #e0e0e0;
    }

    .account-name {
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Tabla Matriz: IG | FB | OTRA */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.85rem;
    }

    .matrix-table th, .matrix-table td {
      border: 1px solid var(--primary);
      padding: 6px 4px;
    }

    .matrix-table th {
      background-color: #f1f5f9;
      font-weight: bold;
    }

    .row-label {
      text-align: left;
      font-weight: bold;
      padding-left: 8px !important;
      background-color: #f8fafc;
    }

    .badge-principal {
      display: inline-block;
      padding: 2px 8px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Gráfica de Barras: Ayer vs Hoy */
    .chart-section {
      border-top: 1px dashed var(--primary);
      padding-top: 12px;
      text-align: center;
    }

    .chart-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .bars-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 30px;
      height: 120px;
      padding-bottom: 5px;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 45px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar-val {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .bar {
      width: 100%;
      border: 1.5px solid var(--primary);
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease;
    }

    .bar-yesterday { background-color: var(--bar-yesterday); }
    .bar-today { background-color: var(--bar-today); }

    .bar-label {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container" id="dashboard">
    <!-- Se genera dinámicamente -->
  </div>

  <script>
    // Configuración de avatares locales
    const AVATARS = {
      'Félix Arratia': 'Felix.png',
      'Secretaría de Igualdad e Inclusión': 'Logo.png',
      'Mónica Oyervides': 'Monica.png'
    };

    function formatNum(num) {
      if (!num) return '0';
      return Number(num).toLocaleString('es-MX');
    }

    function renderCard(accountName, rows) {
      // Filtrar plataformas por tipo
      const ig = rows.find(r => r.red.toLowerCase().includes('instagram')) || {};
      const fb = rows.find(r => r.red.toLowerCase().includes('facebook')) || {};
      
      // Capturar otras redes (TikTok, X, LinkedIn, etc.)
      const otras = rows.filter(r => 
        !r.red.toLowerCase().includes('instagram') && 
        !r.red.toLowerCase().includes('facebook')
      );

      // Consolidar totales
      const igSeg = ig.seguidores || 0;
      const fbSeg = fb.seguidores || 0;
      const otrasSeg = otras.reduce((sum, r) => sum + (r.seguidores || 0), 0);

      const igPub = ig.publicaciones || 0;
      const fbPub = fb.publicaciones || 0;
      const otrasPub = otras.reduce((sum, r) => sum + (r.publicaciones || 0), 0);

      // Totales de publicaciones globales (Ayer vs Hoy)
      const pubAyerTotal = rows.reduce((sum, r) => sum + (r.publicaciones_ayer || 0), 0);
      const pubHoyTotal = rows.reduce((sum, r) => sum + (r.publicaciones_hoy || 0), 0);

      // Determinar Red Principal (la de mayor seguidores)
      let mainRed = 'FB';
      let maxSeg = fbSeg;
      if (igSeg > maxSeg) { mainRed = 'IG'; maxSeg = igSeg; }
      if (otrasSeg > maxSeg) { mainRed = 'Otra'; }

      // Escala para la altura de las barras (máximo 80px)
      const maxVal = Math.max(pubAyerTotal, pubHoyTotal, 1);
      const hAyer = Math.max((pubAyerTotal / maxVal) * 80, 6);
      const hHoy = Math.max((pubHoyTotal / maxVal) * 80, 6);

      const avatarSrc = AVATARS[accountName] || '';

      return `
        <div class="card">
          <!-- Encabezado -->
          <div class="account-header">
            <img class="avatar" src="${avatarSrc}" onerror="this.src='https://via.placeholder.com/50'">
            <div class="account-name">${accountName}</div>
          </div>

          <!-- Matriz de Métricas -->
          <table class="matrix-table">
            <thead>
              <tr>
                <th></th>
                <th>Ig</th>
                <th>Fb</th>
                <th>Otra</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="row-label">Seguidores</td>
                <td>${formatNum(igSeg)}</td>
                <td>${formatNum(fbSeg)}</td>
                <td>${formatNum(otrasSeg)}</td>
              </tr>
              <tr>
                <td class="row-label">Publicaciones</td>
                <td>${formatNum(igPub)}</td>
                <td>${formatNum(fbPub)}</td>
                <td>${formatNum(otrasPub)}</td>
              </tr>
            </tbody>
          </table>

          <!-- Red Principal -->
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; padding:0 4px;">
            <span style="font-weight:bold;">Red principal:</span>
            <span class="badge-principal">${mainRed}</span>
          </div>

          <!-- Gráfica Publicaciones: Ayer vs Hoy -->
          <div class="chart-section">
            <div class="chart-title">Publicaciones</div>
            <div class="bars-container">
              <div class="bar-group">
                <span class="bar-val">${pubAyerTotal}</span>
                <div class="bar bar-yesterday" style="height: ${hAyer}px;"></div>
                <span class="bar-label">Ayer</span>
              </div>
              <div class="bar-group">
                <span class="bar-val">${pubHoyTotal}</span>
                <div class="bar bar-today" style="height: ${hHoy}px;"></div>
                <span class="bar-label">Hoy</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Cargar y procesar Excel automáticamente
    fetch('Redes.xlsx')
      .then(res => res.arrayBuffer())
      .then(data => {
        const wb = XLSX.read(data, { type: 'array' });
        const pubSheet = wb.Sheets['Publicaciones'];
        const rows = XLSX.utils.sheet_to_json(pubSheet);

        // Agrupar filas por Cuenta
        const grouped = {};
        rows.forEach(r => {
          if (!grouped[r.cuenta]) grouped[r.cuenta] = [];
          grouped[r.cuenta].push(r);
        });

        // Renderizar cada cuenta
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';
        Object.keys(grouped).forEach(cuenta => {
          dashboard.innerHTML += renderCard(cuenta, grouped[cuenta]);
        });
      })
      .catch(err => console.error("Error al cargar Redes.xlsx:", err));
  </script>
</body>
</html>
